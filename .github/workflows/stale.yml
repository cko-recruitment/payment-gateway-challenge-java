name: Stale PR

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          stale-pr-message: 'This PR has been inactive for 30 days. Please update or close.'
          close-pr-message: 'Closing due to inactivity.'
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-message: 'This issue has been inactive for 30 days.'
          days-before-issue-stale: 30
          days-before-issue-close: -1
