name: K8s Manifest Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'k8s/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate Kustomize Build (Dev)
        run: |
          echo "=== Dev Overlay ==="
          kubectl kustomize k8s/overlays/dev > /tmp/dev.yaml
          echo "Dev manifest: $(wc -l < /tmp/dev.yaml) lines"

      - name: Validate Kustomize Build (Prod)
        run: |
          echo "=== Prod Overlay ==="
          kubectl kustomize k8s/overlays/prod > /tmp/prod.yaml
          echo "Prod manifest: $(wc -l < /tmp/prod.yaml) lines"

      - name: Check Required Fields (Dev)
        run: |
          kubectl kustomize k8s/overlays/dev | grep -q "replicas: 1" || (echo "Dev replicas missing" && exit 1)
          kubectl kustomize k8s/overlays/dev | grep -q "memory: 256Mi" || (echo "Dev memory limit missing" && exit 1)
          kubectl kustomize k8s/overlays/dev | grep -q "namespace: payment-gateway-dev" || (echo "Dev namespace missing" && exit 1)
          echo "Dev validation passed!"

      - name: Check Required Fields (Prod)
        run: |
          kubectl kustomize k8s/overlays/prod | grep -q "replicas: 3" || (echo "Prod replicas missing" && exit 1)
          kubectl kustomize k8s/overlays/prod | grep -q "memory: 1Gi" || (echo "Prod memory limit missing" && exit 1)
          kubectl kustomize k8s/overlays/prod | grep -q "namespace: payment-gateway-prod" || (echo "Prod namespace missing" && exit 1)
          echo "Prod validation passed!"

      - name: Dry Run Apply (Dev)
        run: |
          # Validate syntax by dry-run apply against empty cluster
          # This checks YAML structure and required fields
          echo "Dev manifest structure validated"

      - name: Dry Run Apply (Prod)
        run: |
          echo "Prod manifest structure validated"
