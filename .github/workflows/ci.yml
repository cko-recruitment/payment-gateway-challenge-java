name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Start Bank Simulator
        run: |
          docker run -d --name bank-simulator \
            -p 2525:2525 -p 8080:8080 \
            -v ${{ github.workspace }}/imposters:/imposters \
            bbyars/mountebank:2.8.1 \
            --configfile /imposters/bank_simulator.ejs --allowInjection
          sleep 5
          curl -f http://localhost:2525/imposters || (echo "Bank simulator failed to start" && exit 1)

      - name: Set Bank URL for CI
        run: echo "BANK_URL=http://localhost:8080/payments" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build -x test

      - name: Unit Tests
        run: ./gradlew test

      - name: Integration Tests
        run: ./gradlew integrationTest

      - name: Functional Tests
        run: ./gradlew functionalTest

      - name: Test Summary
        if: github.event_name == 'pull_request'
        uses: test-summary/action@v2
        with:
          paths: |
            build/test-results/test/*.xml
            build/test-results/integrationTest/*.xml
            build/test-results/functionalTest/*.xml
          show: "fail, skip"
        continue-on-error: true

      - name: Generate Coverage Report
        run: ./gradlew jacocoFullReport

      - name: Debug Coverage Report Exists
        if: github.event_name == 'pull_request'
        run: |
          ls -la build/reports/jacoco/jacocoFullReport/
          head -20 build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml

      - name: Parse Coverage Report
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          
          tree = ET.parse('build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml')
          root = tree.getroot()
          
          # Overall coverage
          total_missed = 0
          total_covered = 0
          for counter in root.findall('.//report/counter'):
              if counter.get('type') == 'INSTRUCTION':
                  total_missed += int(counter.get('missed', 0))
                  total_covered += int(counter.get('covered', 0))
          
          overall = total_covered / (total_missed + total_covered) * 100 if (total_missed + total_covered) > 0 else 0
          
          # Package level
          packages = []
          for pkg in root.findall('.//package'):
              name = pkg.get('name', '').replace('/', '.')
              missed = 0
              covered = 0
              for counter in pkg.findall('counter'):
                  if counter.get('type') == 'INSTRUCTION':
                      missed += int(counter.get('missed', 0))
                      covered += int(counter.get('covered', 0))
              if missed + covered > 0:
                  pct = covered / (missed + covered) * 100
                  packages.append((name, pct, missed + covered))
          
          packages.sort(key=lambda x: x[1])
          
          # Generate markdown
          lines = []
          lines.append(f"## 📊 Coverage Report: {overall:.1f}%")
          lines.append("")
          lines.append("| Package | Coverage | Lines |")
          lines.append("|---------|----------|-------|")
          
          for name, pct, total in packages[:20]:  # Top 20
              status = "🟢" if pct >= 70 else "🟡" if pct >= 50 else "🔴"
              lines.append(f"| {name} | {status} {pct:.1f}% | {total} |")
          
          if len(packages) > 20:
              lines.append(f"| ... ({len(packages) - 20} more) | | |")
          
          with open('coverage-comment.md', 'w') as f:
              f.write('\n'.join(lines))
          
          print(f"overall={overall:.1f}")
          EOF
          echo "overall=$(cat coverage-comment.md | head -1 | grep -o '[0-9.]*%' | head -1)" >> $GITHUB_OUTPUT

      - name: Post Coverage Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md

      - name: Fail if Coverage Low
        if: github.event_name == 'pull_request' && steps.coverage.outputs.overall < 70
        run: |
          echo "Coverage ${{ steps.coverage.outputs.overall }} is below 70%"
          exit 1

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoFullReport/html/

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Label PR Size
        uses: codelytv/pr-size-labeler@v1
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 100
          m_label: 'size/m'
          m_max_size: 500
          l_label: 'size/l'
          l_max_size: 1000
          xl_label: 'size/xl'
          fail_if_xl: false

      - name: Stop Bank Simulator
        if: always()
        run: docker stop bank-simulator && docker rm bank-simulator
