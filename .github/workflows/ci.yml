name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # Kept as two steps so a unit failure is distinguishable from an E2E failure.
      - name: Unit tests
        run: ./gradlew build

      # ubuntu-latest provides a Docker daemon, so no extra setup is needed. On failure the
      # tail of the output is echoed as annotations, which are readable without a token.
      - name: End-to-end tests
        run: |
          set -o pipefail
          ./gradlew e2eTest 2>&1 | tee /tmp/e2e.log || {
            cat build/test-results/e2eTest/*.xml 2>/dev/null | tr '<' '\n' \
              | grep -E 'Caused by|Exception:|Error:' | cut -c1-280 | sort -u | head -8 \
              | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          }
