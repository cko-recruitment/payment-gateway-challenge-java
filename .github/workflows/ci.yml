name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Start Bank Simulator
        run: |
          docker run -d --name bank-simulator \
            -p 2525:2525 -p 8080:8080 \
            -v ${{ github.workspace }}/imposters:/imposters \
            bbyars/mountebank:2.8.1 \
            --configfile /imposters/bank_simulator.ejs --allowInjection
          sleep 5
          curl -f http://localhost:2525/imposters || (echo "Bank simulator failed to start" && exit 1)

      - name: Set Bank URL for CI
        run: echo "BANK_URL=http://localhost:8080/payments" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build -x test

      - name: Unit Tests
        run: ./gradlew test

      - name: Integration Tests
        run: ./gradlew integrationTest

      - name: Functional Tests
        run: ./gradlew functionalTest

      - name: Test Summary
        if: github.event_name == 'pull_request'
        uses: test-summary/action@v2
        with:
          paths: |
            build/test-results/test/*.xml
            build/test-results/integrationTest/*.xml
            build/test-results/functionalTest/*.xml
          show: "fail, skip"
        continue-on-error: true

      - name: Generate Coverage Report
        run: ./gradlew jacocoFullReport

      - name: Debug Coverage Report Exists
        if: github.event_name == 'pull_request'
        run: |
          ls -la build/reports/jacoco/jacocoFullReport/
          head -20 build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml

      - name: Add Coverage to PR Comment
        uses: madrapps/jacoco-report@v1.6.1
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          paths: build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 'Coverage Report'
          update-comment: true
          fail-on-coverage-less-than-min: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoFullReport/html/

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Label PR Size
        uses: codelytv/pr-size-labeler@v1
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 100
          m_label: 'size/m'
          m_max_size: 500
          l_label: 'size/l'
          l_max_size: 1000
          xl_label: 'size/xl'
          fail_if_xl: false

      - name: Stop Bank Simulator
        if: always()
        run: docker stop bank-simulator && docker rm bank-simulator
