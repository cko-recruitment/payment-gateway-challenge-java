name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Start Bank Simulator
        run: |
          docker run -d --name bank-simulator \
            -p 2525:2525 -p 8080:8080 \
            -v ${{ github.workspace }}/imposters:/imposters \
            bbyars/mountebank:2.8.1 \
            --configfile /imposters/bank_simulator.ejs --allowInjection
          sleep 5
          curl -f http://localhost:2525/imposters || (echo "Bank simulator failed to start" && exit 1)

      - name: Set Bank URL for CI
        run: echo "BANK_URL=http://localhost:8080/payments" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build -x test

      - name: Unit Tests
        run: ./gradlew test

      - name: Integration Tests
        run: ./gradlew integrationTest

      - name: Functional Tests
        run: ./gradlew functionalTest

      - name: Generate Test Report
        if: github.event_name == 'pull_request'
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import glob
          import os

          def parse_test_results(pattern, label):
              files = glob.glob(pattern)
              total = passed = failed = skipped = errors = 0
              for f in files:
                  try:
                      tree = ET.parse(f)
                      root = tree.getroot()
                      total += int(root.get('tests', 0))
                      failed += int(root.get('failures', 0))
                      errors += int(root.get('errors', 0))
                      skipped += int(root.get('skipped', 0))
                  except Exception:
                      pass
              passed = total - failed - errors - skipped
              return {
                  'label': label,
                  'total': total,
                  'passed': passed,
                  'failed': failed + errors,
                  'skipped': skipped
              }

          unit = parse_test_results('build/test-results/test/*.xml', 'Unit Tests')
          integration = parse_test_results('build/test-results/integrationTest/*.xml', 'Integration Tests')
          functional = parse_test_results('build/test-results/functionalTest/*.xml', 'Functional Tests')

          lines = []
          lines.append("## 🧪 Test Results")
          lines.append("")
          lines.append("| Test Type | Total | ✅ Passed | ❌ Failed | ⏭️ Skipped |")
          lines.append("|-----------|-------|-----------|-----------|------------|")

          for result in [unit, integration, functional]:
              status = "🟢" if result['failed'] == 0 else "🔴"
              lines.append(f"| {status} {result['label']} | {result['total']} | {result['passed']} | {result['failed']} | {result['skipped']} |")

          total_all = unit['total'] + integration['total'] + functional['total']
          failed_all = unit['failed'] + integration['failed'] + functional['failed']

          lines.append("")
          if failed_all == 0:
              lines.append(f"**All {total_all} tests passed!**")
          else:
              lines.append(f"**{failed_all} of {total_all} tests failed.**")

          with open('test-report.md', 'w') as f:
              f.write('\n'.join(lines))

          print('\n'.join(lines))
          EOF

      - name: Post Test Report
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          path: test-report.md

      - name: Generate Coverage Reports
        run: |
          # Generate unit test only report
          ./gradlew jacocoTestReport
          # Generate integration test only report
          ./gradlew jacocoIntegrationReport
          # Generate functional test only report
          ./gradlew jacocoFunctionalReport
          # Generate full report (unit + integration + functional)
          ./gradlew jacocoFullReport

      - name: Debug Coverage Reports
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Unit Test Report ==="
          ls -la build/reports/jacoco/test/ || true
          echo ""
          echo "=== Integration Test Report ==="
          ls -la build/reports/jacoco/jacocoIntegrationReport/ || true
          echo ""
          echo "=== Functional Test Report ==="
          ls -la build/reports/jacoco/jacocoFunctionalReport/ || true
          echo ""
          echo "=== Full Report ==="
          ls -la build/reports/jacoco/jacocoFullReport/ || true

      - name: Parse Coverage Report
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import os
          
          def parse_coverage(xml_path):
              """Parse JaCoCo XML and return (overall_pct, packages_list)"""
              try:
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  
                  # Overall coverage
                  total_missed = 0
                  total_covered = 0
                  for counter in root.findall('counter'):
                      if counter.get('type') == 'INSTRUCTION':
                          total_missed += int(counter.get('missed', 0))
                          total_covered += int(counter.get('covered', 0))
                  
                  overall = total_covered / (total_missed + total_covered) * 100 if (total_missed + total_covered) > 0 else 0
                  
                  # Package level
                  packages = []
                  for pkg in root.findall('package'):
                      name = pkg.get('name', '').replace('/', '.')
                      missed = 0
                      covered = 0
                      for counter in pkg.findall('counter'):
                          if counter.get('type') == 'INSTRUCTION':
                              missed += int(counter.get('missed', 0))
                              covered += int(counter.get('covered', 0))
                      if missed + covered > 0:
                          pct = covered / (missed + covered) * 100
                          packages.append((name, pct, missed + covered))
                  
                  packages.sort(key=lambda x: x[1])
                  return overall, packages
              except Exception as e:
                  print(f"Error parsing {xml_path}: {e}")
                  return 0.0, []
          
          def format_coverage_table(packages, title):
              """Format package coverage as markdown table"""
              lines = []
              lines.append(f"### {title}")
              lines.append("")
              lines.append("| Package | Coverage | Lines |")
              lines.append("|---------|----------|-------|")
              
              if not packages:
                  lines.append("| *No coverage data* | - | - |")
                  return lines
              
              for name, pct, total in packages[:20]:
                  status = "🟢" if pct >= 70 else "🟡" if pct >= 50 else "🔴"
                  lines.append(f"| {name} | {status} {pct:.1f}% | {total} |")
              
              if len(packages) > 20:
                  lines.append(f"| ... ({len(packages) - 20} more) | | |")
              
              return lines
          
          # Parse all coverage reports
          unit_overall, unit_packages = parse_coverage('build/reports/jacoco/test/jacocoTestReport.xml')
          integration_overall, integration_packages = parse_coverage('build/reports/jacoco/jacocoIntegrationReport/jacocoIntegrationReport.xml')
          functional_overall, functional_packages = parse_coverage('build/reports/jacoco/jacocoFunctionalReport/jacocoFunctionalReport.xml')
          full_overall, full_packages = parse_coverage('build/reports/jacoco/jacocoFullReport/jacocoFullReport.xml')
          
          # Generate markdown
          lines = []
          lines.append("## 📊 Coverage Report")
          lines.append("")
          lines.append("| Test Scope | Coverage |")
          lines.append("|------------|----------|")
          lines.append(f"| Unit Tests | {unit_overall:.1f}% |")
          lines.append(f"| Integration Tests | {integration_overall:.1f}% |")
          lines.append(f"| Functional Tests | {functional_overall:.1f}% |")
          lines.append(f"| **Combined (All)** | **{full_overall:.1f}%** |")
          lines.append("")
          
          # Unit test package detail
          lines.extend(format_coverage_table(unit_packages, f"📋 Unit Test Package Detail ({unit_overall:.1f}%)"))
          lines.append("")
          
          # Integration test package detail
          lines.extend(format_coverage_table(integration_packages, f"📋 Integration Test Package Detail ({integration_overall:.1f}%)"))
          lines.append("")
          
          # Functional test package detail
          lines.extend(format_coverage_table(functional_packages, f"📋 Functional Test Package Detail ({functional_overall:.1f}%)"))
          lines.append("")
          
          # Run info
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{run_id}"
          lines.append(f"*Report updated by [CI Run #{run_id}]({run_url})*")
          
          with open('coverage-comment.md', 'w') as f:
              f.write('\n'.join(lines))
          
          print(f"overall={full_overall:.1f}")
          EOF
          # Extract percentage number for step output
          echo "overall=$(sed -n 's/.*Combined (All).*|\*\([0-9.]*\)%\*.*/\1/p' coverage-comment.md)" >> $GITHUB_OUTPUT

      - name: Post Coverage Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md
          recreate: true

      - name: Fail if Coverage Low
        if: github.event_name == 'pull_request' && steps.coverage.outputs.overall < 70
        run: |
          echo "Coverage ${{ steps.coverage.outputs.overall }} is below 70%"
          exit 1

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoFullReport/html/

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Label PR Size
        uses: codelytv/pr-size-labeler@v1
        if: github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 100
          m_label: 'size/m'
          m_max_size: 500
          l_label: 'size/l'
          l_max_size: 1000
          xl_label: 'size/xl'
          fail_if_xl: false

      - name: Stop Bank Simulator
        if: always()
        run: docker stop bank-simulator && docker rm bank-simulator
