name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # Kept as two steps so a unit failure is distinguishable from an E2E failure.
      - name: Unit tests
        run: ./gradlew build

      - name: Docker environment
        run: |
          printf '::notice::id=%s\n' "$(id)"
          printf '::notice::DOCKER_HOST=%s\n' "${DOCKER_HOST:-unset}"
          printf '::notice::socket=%s\n' "$(ls -l /var/run/docker.sock 2>&1)"
          printf '::notice::context=%s\n' \
            "$(docker context ls --format '{{.Name}}|{{.DockerEndpoint}}|{{.Current}}' | tr '\n' ' ')"

      # ubuntu-latest provides a Docker daemon, so no extra setup is needed. On failure the
      # tail of the output is echoed as annotations, which are readable without a token.
      - name: End-to-end tests
        run: |
          set -o pipefail
          ./gradlew e2eTest 2>&1 | tee /tmp/e2e.log || {
            grep -E 'DockerClientProviderStrategy|Docker environment|docker.sock|Caused by' \
              /tmp/e2e.log | cut -c1-280 | sort -u | head -8 \
              | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          }
