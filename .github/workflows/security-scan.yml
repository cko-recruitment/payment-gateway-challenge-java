name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Monday at 9:00 AM
    - cron: '0 9 * * 1'

jobs:
  sast:
    name: SAST - Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # CodeQL Analysis - GitHub's SAST engine
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended,security-and-quality

      - name: Build for CodeQL
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

      # OWASP Dependency-Check - Scan for known vulnerabilities in dependencies
      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --info || true

      - name: Copy Dependency Check Report
        run: |
          mkdir -p reports
          cp build/reports/dependency-check-report.* reports/ || true

      - name: Parse Dependency Check Results
        if: github.event_name == 'pull_request'
        run: |
          # Extract vulnerability counts from JSON report
          if [ -f "reports/dependency-check-report.json" ]; then
            CRITICAL=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity == "CRITICAL")] | length' reports/dependency-check-report.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity == "HIGH")] | length' reports/dependency-check-report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity == "MEDIUM")] | length' reports/dependency-check-report.json 2>/dev/null || echo "0")
            LOW=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity == "LOW")] | length' reports/dependency-check-report.json 2>/dev/null || echo "0")
            
            echo "DEP_CHECK_CRITICAL=$CRITICAL" >> $GITHUB_ENV
            echo "DEP_CHECK_HIGH=$HIGH" >> $GITHUB_ENV
            echo "DEP_CHECK_MEDIUM=$MEDIUM" >> $GITHUB_ENV
            echo "DEP_CHECK_LOW=$LOW" >> $GITHUB_ENV
          else
            echo "DEP_CHECK_CRITICAL=0" >> $GITHUB_ENV
            echo "DEP_CHECK_HIGH=0" >> $GITHUB_ENV
            echo "DEP_CHECK_MEDIUM=0" >> $GITHUB_ENV
            echo "DEP_CHECK_LOW=0" >> $GITHUB_ENV
          fi

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      - name: Post SAST Summary
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-sast
          message: |
            ## 🔒 SAST Security Scan Results

            ### CodeQL Analysis
            - Status: ${{ job.status == 'success' && '✅ Completed' || '❌ Failed' }}
            - Results: View in [Security tab](../../security/code-scanning)

            ### OWASP Dependency-Check
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${{ env.DEP_CHECK_CRITICAL }} |
            | 🟠 High | ${{ env.DEP_CHECK_HIGH }} |
            | 🟡 Medium | ${{ env.DEP_CHECK_MEDIUM }} |
            | 🔵 Low | ${{ env.DEP_CHECK_LOW }} |

            📄 [Full Dependency Check Report](../../actions/runs/${{ github.run_id }})

            *Scan completed at ${{ github.event.head_commit.timestamp }}*

  dast:
    name: DAST - Dynamic Analysis
    runs-on: ubuntu-latest
    needs: [sast]
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Application
        run: ./gradlew bootJar

      - name: Start Bank Simulator
        run: |
          docker run -d --name bank-simulator-dast \
            -p 2525:2525 -p 8080:8080 \
            -v ${{ github.workspace }}/imposters:/imposters \
            bbyars/mountebank:2.8.1 \
            --configfile /imposters/bank_simulator.ejs --allowInjection
          sleep 5
          curl -f http://localhost:2525/imposters || (echo "Bank simulator failed to start" && exit 1)

      - name: Start Application
        run: |
          export BANK_URL=http://localhost:8080/payments
          java -jar build/libs/*.jar &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          # Wait for app to be ready (with retries)
          for i in {1..30}; do
            sleep 2
            if curl -sf http://localhost:8090/actuator/health > /dev/null 2>&1; then
              echo "Application started successfully"
              exit 0
            fi
            echo "Waiting for app... attempt $i/30"
          done
          echo "App failed to start"
          exit 1

      - name: OWASP ZAP Baseline Scan
        id: zap
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8090'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Parse ZAP Results
        if: always()
        run: |
          # ZAP action creates report_*.html files
          # Extract alert counts from the JSON report if available
          if [ -f "report_json.json" ]; then
            HIGH=$(jq '[.site[0].alerts[] | select(.riskcode == "3")] | length' report_json.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[0].alerts[] | select(.riskcode == "2")] | length' report_json.json 2>/dev/null || echo "0")
            LOW=$(jq '[.site[0].alerts[] | select(.riskcode == "1")] | length' report_json.json 2>/dev/null || echo "0")
            INFO=$(jq '[.site[0].alerts[] | select(.riskcode == "0")] | length' report_json.json 2>/dev/null || echo "0")
          else
            HIGH=0
            MEDIUM=0
            LOW=0
            INFO=0
          fi
          
          echo "ZAP_HIGH=$HIGH" >> $GITHUB_ENV
          echo "ZAP_MEDIUM=$MEDIUM" >> $GITHUB_ENV
          echo "ZAP_LOW=$LOW" >> $GITHUB_ENV
          echo "ZAP_INFO=$INFO" >> $GITHUB_ENV

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_*.html
            report_json.json

      - name: Post DAST Summary
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-dast
          message: |
            ## 🌐 DAST Security Scan Results

            ### OWASP ZAP Baseline Scan
            | Risk Level | Count |
            |------------|-------|
            | 🔴 High | ${{ env.ZAP_HIGH }} |
            | 🟠 Medium | ${{ env.ZAP_MEDIUM }} |
            | 🟡 Low | ${{ env.ZAP_LOW }} |
            | 🔵 Informational | ${{ env.ZAP_INFO }} |

            📄 [Full ZAP Report](../../actions/runs/${{ github.run_id }})

            ### Scan Target
            - URL: http://localhost:8090
            - Type: Baseline Scan (passive + active)

            *Scan completed at ${{ github.event.head_commit.timestamp }}*

      - name: Stop Application
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill $APP_PID || true
          fi
          docker stop bank-simulator-dast && docker rm bank-simulator-dast || true

      - name: Fail on High/Critical
        if: env.ZAP_HIGH != '0' || env.DEP_CHECK_CRITICAL != '0' || env.DEP_CHECK_HIGH != '0'
        run: |
          echo "❌ Security scan found HIGH or CRITICAL vulnerabilities!"
          echo "ZAP High: ${{ env.ZAP_HIGH }}"
          echo "Dependency Check Critical: ${{ env.DEP_CHECK_CRITICAL }}"
          echo "Dependency Check High: ${{ env.DEP_CHECK_HIGH }}"
          exit 1
