services:
  k6:
    image: grafana/k6:latest
    container_name: k6
    volumes:
      - ./load-tests:/tests
    command: run /tests/load-test.js
    environment:
      - BASE_URL=http://payment-gateway:8090
    networks:
      - payment-gateway-challenge-java_payment-gateway-network

networks:
  payment-gateway-challenge-java_payment-gateway-network:
    external: true
