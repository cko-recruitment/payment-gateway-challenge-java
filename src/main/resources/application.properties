server.port=8090
# Swagger UI at /swagger-ui/index.html, spec at /v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=list
spring.mvc.problemdetails.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false
payments.bank.api-url=${PAYMENTS_BANK_API_URL:http://localhost:8080}
payments.currencies.supported-currencies=${PAYMENTS_SUPPORTED_CURRENCIES:GBP,USD,EUR}
spring.jackson.deserialization.fail-on-unknown-properties=true

# Actuator: only the health endpoint is exposed over HTTP. Probes add the
# /actuator/health/liveness and /actuator/health/readiness groups.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Logging
logging.level.com.checkout.payment.gateway=${PAYMENTS_LOG_LEVEL:INFO}
