server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.version=5.34.1
springdoc.api-docs.enabled=true
acquirer.url=${ACQUIRER_URL:http://localhost:8080/payments}
acquirer.connect-timeout-ms=2000
acquirer.read-timeout-ms=2000
spring.jackson.deserialization.accept-float-as-int=false
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
# Bound Springdoc cache keys to one locale (GHSA-rhhx-6j8h-8cvw).
spring.web.locale=en
spring.web.locale-resolver=fixed
