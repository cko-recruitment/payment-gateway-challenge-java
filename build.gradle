plugins {
  id 'java'
  id 'org.springframework.boot' version '4.0.6'
  id "org.openapi.generator" version "7.22.0"
}

group = 'com.checkout'
version = '0.0.1-SNAPSHOT'

java {
  sourceCompatibility = '25'
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation platform("org.springframework.boot:spring-boot-dependencies:4.0.6")

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
  implementation 'org.springframework.boot:spring-boot-starter-aspectj'
  implementation "org.mapstruct:mapstruct:1.6.3"
  implementation 'jakarta.validation:jakarta.validation-api'
  implementation 'jakarta.annotation:jakarta.annotation-api'

  compileOnly 'org.projectlombok:lombok:1.18.46'

  testImplementation 'org.projectlombok:lombok:1.18.46'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation "org.testcontainers:testcontainers:1.20.0"
  testImplementation "org.testcontainers:junit-jupiter:1.20.0"

  annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
  annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"
  annotationProcessor "org.projectlombok:lombok:1.18.46"

  testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

openApiGenerate {
  generatorName = "spring"
  inputSpec = "$projectDir/src/main/resources/api/payment-gateway.yaml".toString()
  outputDir = "$buildDir/generated".toString()
  apiPackage = "com.checkout.payment.gateway.generated.api"
  modelPackage = "com.checkout.payment.gateway.generated.api.model"
  configOptions = [
      delegatePattern         : "true",
      useSpringBoot4          : "true",
      useJackson3             : "true",
      useJakartaEe            : "true",
      openApiNullable         : "false",
      useTags                 : "true",
      interfaceOnly           : "true",
      serializableModel       : "true",
      useEnumCaseInsensitive  : "true",
      unhandledException      : "true",
      useLombok               : "true",
      useSwaggerAnnotations   : "false",
      documentationProvider   : "none",
      additionalModelTypeAnnotations: "@lombok.Builder"
  ]
}

sourceSets {
  main {
    java {
      srcDirs += "$buildDir/generated/src/main/java"
    }
  }
}

compileJava {
  dependsOn tasks.named('openApiGenerate')
}

test {
  useJUnitPlatform()
  include '**/*Test.class'
  include '**/*IT.class'
  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = true
  }
}