plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'jacoco'
    id 'org.springframework.boot' version '3.1.5'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'org.owasp.dependencycheck' version '9.0.9'
}

// OWASP Dependency-Check configuration
dependencyCheck {
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }
    // Suppress false positives and reduce noise
    suppressionFiles = ['dependency-check-suppressions.xml']
    // Skip test dependencies
    skipConfigurations = ['testImplementation', 'integrationTestImplementation', 'functionalTestImplementation']
    // Output formats
    formats = ['HTML', 'JSON']
    // Fail on CVSS 7+ (HIGH and CRITICAL)
    failBuildOnCVSS = 7.0
}

group = 'com.checkout'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    

    // Rate Limit & Metrics — AOP support
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // Observability — Actuator health checks and Prometheus metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Distributed Tracing - OpenTelemetry
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-jaeger'
    implementation 'io.micrometer:micrometer-observation'
    implementation 'org.aspectj:aspectjweaver:1.9.20'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }

    functionalTest {
        java.srcDir file('src/functionalTest/java')
        resources.srcDir file('src/functionalTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestCompileOnly.extendsFrom compileOnly
    integrationTestAnnotationProcessor.extendsFrom annotationProcessor

    functionalTestImplementation.extendsFrom testImplementation
    functionalTestRuntimeOnly.extendsFrom testRuntimeOnly
    functionalTestCompileOnly.extendsFrom compileOnly
    functionalTestAnnotationProcessor.extendsFrom annotationProcessor
}

task integrationTest(type: Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
}

task functionalTest(type: Test) {
    description = 'Runs functional tests.'
    group = 'verification'
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.withType(Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        showCauses true
        showStackTraces true
        exceptionFormat "full"
    }
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nTest result: ${result.resultType}"
            println "Tests: ${result.testCount}, Passed: ${result.successfulTestCount}, Failed: ${result.failedTestCount}, Skipped: ${result.skippedTestCount}"
        }
    }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
    executionData(
        fileTree(project.buildDir).include("**/jacoco/test.exec")
    )
    sourceSets sourceSets.main
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                // Swagger / API docs
                'com/checkout/payment/gateway/controller/PaymentGatewayApi.class',
                // Model / POJO
                'com/checkout/payment/gateway/model/**',
                // Enums / Constants
                'com/checkout/payment/gateway/enums/**',
                // Exceptions
                'com/checkout/payment/gateway/exception/**',
                // Framework / Config
                'com/checkout/payment/gateway/configuration/**',
                'com/checkout/payment/gateway/PaymentGatewayApplication.class',
                // Dead code / TODO interfaces
                'com/checkout/payment/gateway/aspect/Metrics.class',
                'com/checkout/payment/gateway/aspect/RateLimiter.class',
                // Security wrapper
                'com/checkout/payment/gateway/security/SecureLogger.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }
}

// Integration test only coverage report
task jacocoIntegrationReport(type: JacocoReport) {
    group = 'verification'
    description = 'Generates coverage report from integration tests only'
    
    dependsOn integrationTest
    
    executionData(
        fileTree(project.buildDir).include("**/jacoco/integrationTest.exec")
    )
    
    sourceSets sourceSets.main
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/checkout/payment/gateway/controller/PaymentGatewayApi.class',
                'com/checkout/payment/gateway/model/**',
                'com/checkout/payment/gateway/enums/**',
                'com/checkout/payment/gateway/exception/**',
                'com/checkout/payment/gateway/configuration/**',
                'com/checkout/payment/gateway/PaymentGatewayApplication.class',
                'com/checkout/payment/gateway/aspect/Metrics.class',
                'com/checkout/payment/gateway/aspect/RateLimiter.class',
                'com/checkout/payment/gateway/security/SecureLogger.class'
            ])
        }))
    }
}

// Functional test only coverage report
task jacocoFunctionalReport(type: JacocoReport) {
    group = 'verification'
    description = 'Generates coverage report from functional tests only'
    
    dependsOn functionalTest
    
    executionData(
        fileTree(project.buildDir).include("**/jacoco/functionalTest.exec")
    )
    
    sourceSets sourceSets.main
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/checkout/payment/gateway/controller/PaymentGatewayApi.class',
                'com/checkout/payment/gateway/model/**',
                'com/checkout/payment/gateway/enums/**',
                'com/checkout/payment/gateway/exception/**',
                'com/checkout/payment/gateway/configuration/**',
                'com/checkout/payment/gateway/PaymentGatewayApplication.class',
                'com/checkout/payment/gateway/aspect/Metrics.class',
                'com/checkout/payment/gateway/aspect/RateLimiter.class',
                'com/checkout/payment/gateway/security/SecureLogger.class'
            ])
        }))
    }
}

// Unified coverage report including unit + integration + functional tests
task jacocoFullReport(type: JacocoReport) {
    group = 'verification'
    description = 'Generates unified coverage report from all test types'
    
    dependsOn test, integrationTest, functionalTest
    
    executionData(
        fileTree(project.buildDir).include("**/jacoco/*.exec")
    )
    
    sourceSets sourceSets.main
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/checkout/payment/gateway/controller/PaymentGatewayApi.class',
                'com/checkout/payment/gateway/model/**',
                'com/checkout/payment/gateway/enums/**',
                'com/checkout/payment/gateway/exception/**',
                'com/checkout/payment/gateway/configuration/**',
                'com/checkout/payment/gateway/PaymentGatewayApplication.class',
                'com/checkout/payment/gateway/aspect/Metrics.class',
                'com/checkout/payment/gateway/aspect/RateLimiter.class',
                'com/checkout/payment/gateway/security/SecureLogger.class'
            ])
        }))
    }
}

// IDE support: mark custom sourceSets as test sources
idea {
    module {
        testSources.from(sourceSets.integrationTest.java.srcDirs)
        testSources.from(sourceSets.functionalTest.java.srcDirs)
        testResources.from(sourceSets.integrationTest.resources.srcDirs)
        testResources.from(sourceSets.functionalTest.resources.srcDirs)
    }
}

// Eclipse support
eclipse {
    classpath {
        plusConfigurations += [configurations.integrationTestRuntimeClasspath, configurations.functionalTestRuntimeClasspath]
    }
}
