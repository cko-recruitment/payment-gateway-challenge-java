apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payment-gateway-dev

resources:
  - ../../base

namePrefix: dev-

replicas:
  - name: payment-gateway
    count: 1

images:
  - name: payment-gateway
    newTag: "latest"

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: payment-gateway
