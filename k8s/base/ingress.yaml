apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-gateway
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: payment-gateway.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-gateway
                port:
                  number: 80
