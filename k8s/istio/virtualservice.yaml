apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-gateway
spec:
  hosts:
    - payment-gateway.example.com
  gateways:
    - payment-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/payments
      route:
        - destination:
            host: payment-gateway
            port:
              number: 80
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      timeout: 10s
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 5s
    - match:
        - uri:
            prefix: /actuator
      route:
        - destination:
            host: payment-gateway
            port:
              number: 80
      # No retries for health endpoints
