apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: payment-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - payment-gateway.example.com
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: payment-gateway-tls
      hosts:
        - payment-gateway.example.com
