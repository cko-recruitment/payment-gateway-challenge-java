apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payment-gateway-network-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - payment-gateway-prod
    labelSelectors:
      app: payment-gateway
  delay:
    latency: '100ms'
    correlation: '50'
    jitter: '50ms'
  duration: '5m'
  scheduler:
    cron: '@hourly'
