services:
  payment-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - payment-gateway:latest
    container_name: payment-gateway
    image: payment-gateway:latest
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - BANK_URL=http://bank_simulator:8080/payments
    depends_on:
      - bank_simulator

  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

networks:
  default:
    name: payment-gateway-network
